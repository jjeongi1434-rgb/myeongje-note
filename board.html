<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명제 탐구 노트 — 교사 보드</title>
<meta name="theme-color" content="#1d2433">
<link rel="manifest" href="board.webmanifest">
<link rel="icon" href="board-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="board-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="명제보드">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1d2433;padding:20px;
     font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#fff}
.b{text-align:center;max-width:560px;width:100%}
.ic{width:92px;height:92px;border-radius:22px;display:block;margin:0 auto 14px}
.b h1{font-size:24px;margin:0 0 6px}
.b p{color:#aab3c6;font-size:15px;margin:0 0 16px;line-height:1.6}
.btn{display:inline-block;background:#7c8ee8;color:#141a26;text-decoration:none;border:0;cursor:pointer;
     border-radius:12px;padding:14px 22px;font-size:17px;font-weight:700;margin:4px;font-family:inherit}
.btn.ghost{background:transparent;color:#cdd5ea;border:1px solid #46506b}
.note{margin-top:18px;font-size:13px;color:#8d97ad;line-height:1.7}
.ok{background:#1f3a2a;border:1px solid #2e7d32;color:#c8f0cf;border-radius:12px;padding:12px;margin:0 0 14px;font-size:15px}
</style>
</head>
<body>
<div class="b">
  <img class="ic" src="board-512.png" alt="">
  <h1>명제 탐구 노트 · 교사 보드</h1>
  <p id="msg">학생 진행 현황과 QR을 전자칠판에 띄웁니다.</p>
  <div id="done" class="ok" hidden>✅ 설치했어요. 이제 바탕화면(홈 화면)의 <b>명제보드</b> 아이콘으로 바로 열면 됩니다.</div>
  <p>
    <a class="btn" id="go" href="index.html?present=1">📺 보드 열기</a>
    <button class="btn ghost" id="inst" hidden>📲 이 기기에 앱으로 설치</button>
  </p>
  <div class="note">
    처음 열 때는 <b>교사 코드</b>(명제교사 또는 mj2026)를 한 번 입력하면, 그 다음부터는 묻지 않아요.<br>
    설치하면 주소를 입력하지 않고 아이콘만 눌러 보드를 열 수 있습니다.
  </div>
</div>
<script>
var STAY = /(\?|&)stay=1/.test(location.search);
var T = null, msg = document.getElementById('msg');
function open_() { try { sessionStorage.setItem('myeongje-present', '1'); } catch (e) {} location.replace('index.html?present=1'); }
function hold() { if (T) { clearTimeout(T); T = null; msg.textContent = '아래 “보드 열기”를 누르면 바로 시작합니다.'; } }
/* 설치 가능하면 자동 이동을 멈추고 설치 버튼을 보여 준다 */
var EV = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); EV = e; hold();
  document.getElementById('inst').hidden = false;
  msg.innerHTML = '이 전자칠판에 <b>앱으로 설치</b>하면 다음 수업부터 아이콘만 눌러 열 수 있어요.';
});
document.getElementById('inst').onclick = function () {
  if (!EV) return; var e = EV; EV = null; this.hidden = true; e.prompt();
};
window.addEventListener('appinstalled', function () {
  document.getElementById('done').hidden = false;
  msg.textContent = '설치가 끝났어요.';
});
/* 설치 안내가 뜨지 않는 기기(이미 설치했거나 설치를 지원하지 않는 브라우저)에서는 바로 보드로 */
if (!STAY) { T = setTimeout(open_, 2500); }
else { msg.innerHTML = '이 기기에 <b>앱으로 설치</b>해 두면 다음 수업부터 아이콘만 눌러 보드를 열 수 있어요.<br>설치 버튼이 보이지 않으면 브라우저 메뉴(⋮) → <b>“앱 설치”</b> 또는 <b>“홈 화면에 추가”</b>를 고르세요.'; }
['click', 'keydown', 'touchstart'].forEach(function (t) { document.addEventListener(t, hold, { once: true }); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
